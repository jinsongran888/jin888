<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 目标站点见到任何 Referer 都会 406，这里直接不发 -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在进入门户…</title>
  <!-- 目标地址：换隧道后只改这一行 -->
  <meta http-equiv="refresh" content="0; url=https://handy-identity-lounge-railroad.trycloudflare.com/jin888/portal/">
  <style>
    html,body{height:100%;margin:0;background:#0f1115;color:#e6e8ee;
      font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    a{color:#6ea8fe;word-break:break-all}
    .tip{margin-top:10px;color:#8b93a7;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div>正在进入门户…</div>
      <div class="tip">如果页面没有自动跳转，点下面这个链接<br>
        <a id="l" rel="noreferrer noopener" href="https://handy-identity-lounge-railroad.trycloudflare.com/jin888/portal/">https://handy-identity-lounge-railroad.trycloudflare.com/jin888/portal/</a>
      </div>
    </div>
  </div>
  <script>
    // 允许 ?u= 临时覆盖跳转目标（换隧道时不用改文件）
    var q = new URLSearchParams(location.search).get('u');
    var target = q || "https://handy-identity-lounge-railroad.trycloudflare.com/jin888/portal/";
    if (q) { document.getElementById('l').href = target; document.getElementById('l').textContent = target; }
    location.replace(target);
  </script>
</body>
</html>
